services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_STORAGE_LISTINGS_PATH: /var/app/uploads/listings
    volumes:
      - listing_images:/var/app/uploads/listings
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: dim_poruch_be_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dim_poruch_be
      POSTGRES_USER: dim_poruch
      POSTGRES_PASSWORD: dim_poruch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dim_poruch -d dim_poruch_be"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  listing_images:
